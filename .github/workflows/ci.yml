name: Voice server checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Check tracked source boundaries
        run: python tools/check_source.py
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Run protocol, cancellation and loudness tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Validate CPU container build
        run: |
          XIAOYA_VOICE_IMAGE="xiaoya-voice:$GITHUB_SHA" XIAOYA_VOICE_COMMIT="$GITHUB_SHA" docker compose config --quiet
          docker build --build-arg "VCS_REF=$GITHUB_SHA" --tag "xiaoya-voice:$GITHUB_SHA" .
      - name: Package reviewed deployment image
        if: github.ref == 'refs/heads/main'
        run: python tools/package_ci_image.py
      - name: Upload short-lived deployment image
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-image-${{ github.sha }}
          path: |
            .ci-artifact/image.tar.gz
            .ci-artifact/image-manifest.json
          compression-level: 0
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
