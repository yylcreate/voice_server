<style>
:root{color-scheme:light;--ink:#213758;--muted:#7d8da5;--line:#e3ebf6;--blue:#3164e7;--green:#249178;--paper:#fff;--bg:#f3f7fd}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f3f7fd,#edf3fc);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}button,input,textarea,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bb8ff;outline-offset:3px}button{border:1px solid #dce6f5;background:#fff;color:#536e96;border-radius:9px;padding:9px 13px;min-height:37px}a{color:#416fd3}.shell{max-width:1360px;margin:auto;padding:24px 26px 28px}.header{display:flex;align-items:center;gap:13px;margin-bottom:20px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#3265e7;color:white;box-shadow:0 7px 18px #3265e724}.logo svg{width:25px;height:25px}.header h1{font-size:21px;margin:0 0 5px;font-weight:650;letter-spacing:.3px}.header p{font-size:11px;color:var(--muted);margin:0}.header-tools{margin-left:auto;display:flex;gap:8px}.input-panel,.server-panel,.history-panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:0 7px 22px #18365f04}.input-panel{padding:19px 21px;margin-bottom:18px}.input-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}.input-top h2{font-size:14px;font-weight:650;margin:0 auto 0 0}.voice-field{display:flex;align-items:center;gap:8px;color:#73849d}.voice-field select{border:1px solid #dce5f4;background:#f9fbff;border-radius:8px;color:#324c72;padding:8px 30px 8px 10px;min-width:177px}.language{font-size:10px;padding:6px 9px;border-radius:7px;background:#f2f6fd;color:#8291a7}.samples{display:flex;gap:8px}.samples button{font-size:11px;padding:5px 9px;min-height:29px}.text-label{display:block;font-size:11px;color:#8290a6;margin-bottom:7px}textarea{width:100%;height:100px;resize:vertical;border:1px solid #dfe8f6;border-radius:10px;background:#fbfcff;color:#3c5474;padding:12px 14px;line-height:1.9;min-height:80px;max-height:300px}.text-meta{display:flex;justify-content:space-between;font-size:10px;color:#8c9ab0;margin-top:7px}.input-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}.primary{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 4px 12px #3164e718}.primary:hover:not(:disabled){background:#2859d2}.danger{color:#b96a71;border-color:#f1dfe2;background:#fffafb}.live-label{font-size:11px;color:#7f8da2;margin-left:auto;display:flex;align-items:center;gap:7px}.live-label select{padding:6px 9px;border:1px solid #e0e7f3;border-radius:7px;color:#627a9e;background:#fafcff}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.server-panel{min-width:0;padding:19px 20px}.server-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:15px}.server-head h2{font-size:16px;margin:0 0 5px;font-weight:650}.side-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#7863ba;background:#f2effc;font-size:18px}.domestic .side-icon{color:#248e77;background:#eaf7f2}.endpoint{font:10px "Consolas",monospace;word-break:break-all;text-decoration:none;color:#8a98ae}.health{font-size:10px;line-height:1.5;color:#7a8ea9;margin-left:auto;border-radius:20px;padding:5px 8px;background:#f2f5fa;white-space:nowrap}.health.ready{color:#27866e;background:#edf8f3}.health.failed{color:#b46670;background:#fff1f2}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{background:#f8faff;border:1px solid #edf1f8;border-radius:10px;padding:11px 12px;min-width:0}.metric:first-child{background:#edf3ff;border-color:#e0e9ff}.metric-name{color:#8492aa;font-size:10px}.metric-value{margin-top:4px;font:500 27px/1.25 "Consolas",monospace;letter-spacing:-.6px;color:#315aab;white-space:nowrap}.metric-value small{font:10px "Segoe UI",sans-serif;letter-spacing:0;color:#94a0b3;margin-left:5px}.metric:not(:first-child) .metric-value{color:#3e5578}.panel-actions{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.panel-actions button{font-size:11px;min-height:33px;padding:7px 10px}.phase-row{display:flex;align-items:flex-start;gap:10px;min-height:38px;margin-top:4px}.phase{font-size:11px;line-height:1.7;color:#8390a8;flex:1;overflow-wrap:anywhere}.phase.complete{color:#388d78}.phase.failed{color:#bd6670}.elapsed{font:18px "Consolas",monospace;color:#647eaa;white-space:nowrap}.elapsed small{font:10px "Segoe UI",sans-serif;margin-left:4px;color:#96a3b7}.wave-box{border:1px solid #e7eef9;border-radius:10px;background:#f8faff;padding:9px 11px 7px}.wave-top{display:flex;justify-content:space-between;font-size:10px;color:#94a2b6;gap:7px}.wave-top span:last-child{text-align:right}canvas{display:block;width:100%;height:54px}.segments{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;min-height:22px}.segment{font-size:9px;line-height:1.6;border-radius:5px;padding:3px 6px;background:#eff4ff;color:#6584bb}.segment.cached{background:#edf7f1;color:#4d947b}.segment.low{background:#fff1e5;color:#bc8652}.level-note{font-size:10px;color:#8e9cb0;min-height:28px;line-height:1.8;margin:7px 0 0}.level-note.warning{color:#b67c47}.audio-result{border-top:1px solid #edf1f8;padding-top:11px;margin-top:11px}.audio-result[hidden]{display:none}.audio-head{display:flex;justify-content:space-between;font-size:10px;color:#8797ae;margin-bottom:7px}.audio-head a{text-decoration:none}audio{display:block;width:100%;height:32px}.comparison-note{min-height:30px;padding:11px 2px;color:#8593aa;font-size:11px;line-height:1.8}.comparison-note strong{color:#3d6fba;font-weight:600}.history-panel{padding:17px 20px;margin-top:4px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.history-head h2{font-size:13px;margin:0}.history-head button{font-size:10px;min-height:30px;padding:6px 10px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}th{text-align:left;color:#98a5b8;font-weight:400;padding:8px 10px;background:#fafcff}td{padding:10px;color:#71849f;border-bottom:1px solid #f0f3f9}tbody tr:last-child td{border:0}.mono{font-family:"Consolas",monospace}.result-tag{font-size:9px;color:#468a75;background:#edf8f2;padding:3px 5px;border-radius:5px}.result-tag.failed{color:#bb6573;background:#fff0f2}.footer{display:flex;justify-content:space-between;gap:12px;font-size:10px;line-height:1.8;color:#96a3b6;margin:12px 2px 0}.empty{text-align:center;color:#a0acbd;padding:20px}.spinner{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px}
@media(max-width:900px){.shell{padding:18px 15px}.server-panel{padding:15px 13px}.server-head{flex-wrap:wrap;gap:7px}.health{font-size:9px}.server-head h2{font-size:14px}.input-top{flex-wrap:wrap}.input-top h2{width:100%}.samples{margin-left:auto}.metric-value{font-size:24px}.footer{flex-direction:column;gap:1px}}
@media(max-width:600px){.comparison{grid-template-columns:1fr}.header h1{font-size:17px}.header p{font-size:10px}.header-tools button{font-size:10px;padding:7px 9px}.logo{width:38px;height:38px}.input-panel{padding:15px}.voice-field{width:100%}.voice-field select{flex:1}.samples{margin-left:0}.live-label{margin-left:0;width:100%;margin-top:3px}.history-panel{padding:14px 12px}.comparison{gap:13px}.server-head{flex-wrap:nowrap}}

<body>
<main class="shell">
  <header class="header">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4m4-8v12m5-16v20m5-16v12m4-8v4"/></svg></div>
    <div><h1>小雅语音 · 国内外对照</h1><p>同一音色、同一段文字，比较两台服务器的速度和声音</p></div>
    <div class="header-tools"><button id="checkBoth" type="button">检测两侧连接</button></div>
  </header>
  <section class="input-panel" aria-labelledby="inputTitle">
    <div class="input-top"><h2 id="inputTitle">共用测试输入</h2><label class="voice-field" for="voice">选择音色<select id="voice" disabled></select></label><span class="language" id="language">中文 · Mandarin</span><div class="samples"><button id="shortSample" type="button" disabled>简短测试</button><button id="fullSample" type="button" disabled>完整示例</button></div></div>
    <label class="text-label" for="text">输入要合成的文字</label><textarea id="text" disabled></textarea>
    <div class="text-meta"><span>仅测试文字转语音，不经过聊天模型</span><span id="charCount">0 字</span></div>
    <div class="input-actions"><button class="primary" id="startBoth" type="button" disabled>同时生成对比</button><button class="danger" id="stopBoth" type="button" disabled>停止两侧</button><label class="live-label" for="liveSource">边生成边听<select id="liveSource"><option value="none">暂不播放，完成后分别试听</option><option value="foreign">只听国外服务器</option><option value="domestic">只听国内服务器</option></select></label></div>
  </section>
  <div class="comparison" id="panels" aria-label="左右服务器对比"></div>
  <div class="comparison-note" id="comparisonNote">点击“同时生成对比”，两侧会独立生成。完成后分别播放，便于听清音色和尾段音量。</div>
  <section class="history-panel" aria-labelledby="historyTitle"><div class="history-head"><h2 id="historyTitle">测试记录</h2><button id="exportHistory" type="button" disabled>导出对比记录</button></div><div class="table-scroll"><table><thead><tr><th>时间</th><th>服务器</th><th>音色</th><th>方式</th><th>首段 / 秒</th><th>完整 / 秒</th><th>音频 / 秒</th><th>结果</th></tr></thead><tbody id="history"><tr><td class="empty" colspan="8">完成测试后显示两侧计时和复用情况。</td></tr></tbody></table></div></section>
  <footer class="footer"><span>两侧直接使用服务器返回的音频；试听音量均为原始1倍。</span><span>计时包含网络传输；播放启动是浏览器调度估算。</span></footer>
</main>
<script>
'use strict';
// 复用单服务测试台的签名代理、完整PCM校验与播放约定；音频保持原样，不在页面补偿尾段音量。--yyl
const $=id=>document.getElementById(id),SIDES=['foreign','domestic'],NAMES={foreign:'国外服务器',domestic:'国内服务器'};
const FULL_EN='Hello! I am Xiaoya, your intelligent manufacturing assistant. I can help you check production orders and track machining progress. How can I help you today?';
const SHORT_ZH='你好，我是小雅。今天有什么我可以帮你的？',SHORT_EN='Hello, I am Xiaoya. How can I help you today?';
const app={config:null,panels:{},history:[],batch:null};
const seconds=value=>value==null?'—':(value/1000).toFixed(2);
const db=value=>value>0?20*Math.log10(value):-Infinity;
function metric(side,name,value,estimate=false){const node=$(side+'-'+name);node.replaceChildren(document.createTextNode(value==null?'—':(estimate?'≈ ':'')+seconds(value)));const unit=document.createElement('small');unit.textContent='秒';node.append(unit);}
function phase(panel,text,kind=''){$(panel.id+'-phase').textContent=text;$(panel.id+'-phase').className='phase '+kind;}
function selectedVoice(){return app.config?.voices.find(item=>item.id===$('voice').value);}
function active(){return SIDES.some(side=>app.panels[side]?.run?.active);}
function controls(){const busy=active(),text=$('text').value.trim();['voice','text','shortSample','fullSample','liveSource'].forEach(id=>$(id).disabled=!app.config||busy);$('startBoth').disabled=!app.config||busy||!text||!SIDES.every(side=>app.panels[side]?.ready);$('stopBoth').disabled=!busy&&!SIDES.some(side=>app.panels[side]?.nodes.size||!$(side+'-audio')?.paused);$('exportHistory').disabled=!app.history.length;for(const side of SIDES){const panel=app.panels[side];if(!panel)continue;const running=!!panel.run?.active;$(side+'-start').disabled=!panel.ready||running||!text;$(side+'-repeat').disabled=!panel.ready||running||!panel.previous||panel.previous.text!==$('text').value||panel.previous.voice!==$('voice').value;$(side+'-stop').disabled=!running&&!panel.nodes.size&&$(side+'-audio').paused;}}
function createPanel(backend){const side=backend.id,section=document.createElement('section');section.className='server-panel '+side;section.setAttribute('aria-labelledby',side+'-title');section.innerHTML=`<div class="server-head"><div class="side-icon" aria-hidden="true">${side==='foreign'?'◎':'⌂'}</div><div><h2 id="${side}-title">${NAMES[side]}</h2><a class="endpoint" id="${side}-endpoint" target="_blank" rel="noopener"></a></div><span class="health" id="${side}-health" role="status">正在检测连接</span></div><div class="metrics"><div class="metric"><div class="metric-name">首段到达</div><div class="metric-value" id="${side}-first">—<small>秒</small></div></div><div class="metric"><div class="metric-name">完整返回</div><div class="metric-value" id="${side}-complete">—<small>秒</small></div></div><div class="metric"><div class="metric-name">播放启动 · 估算</div><div class="metric-value" id="${side}-play">—<small>秒</small></div></div><div class="metric"><div class="metric-name">音频时长</div><div class="metric-value" id="${side}-duration">—<small>秒</small></div></div></div><div class="panel-actions"><button id="${side}-start" type="button" disabled>开始测试</button><button id="${side}-repeat" type="button" disabled>同文复测</button><button id="${side}-stop" class="danger" type="button" disabled>停止</button></div><div class="phase-row"><div class="phase" id="${side}-phase" role="status">等待开始</div><div class="elapsed"><span id="${side}-elapsed">0.0</span><small>秒</small></div></div><div class="wave-box"><div class="wave-top"><span>实际音频波形</span><span id="${side}-bytes">等待音频</span></div><canvas id="${side}-wave" aria-label="${NAMES[side]}返回的原始PCM幅度"></canvas></div><div class="segments" id="${side}-segments" aria-label="${NAMES[side]}各段音量"></div><div class="level-note" id="${side}-level">收到音频后显示各段RMS音量。</div><div class="audio-result" id="${side}-result" hidden><div class="audio-head"><span>完整音频 · 可分别重播</span><a id="${side}-download" download>下载 WAV</a></div><audio id="${side}-audio" controls preload="metadata"></audio></div>`;$('panels').append(section);const panel={id:side,backend,ready:false,healthBusy:false,run:null,previous:null,context:null,nodes:new Set(),nextAt:0,url:null};app.panels[side]=panel;$(side+'-endpoint').textContent=backend.endpoint;$(side+'-endpoint').href=backend.endpoint+'/health';$(side+'-start').addEventListener('click',()=>start(panel,'fresh'));$(side+'-repeat').addEventListener('click',()=>start(panel,'repeat'));$(side+'-stop').addEventListener('click',()=>stop(panel));$(side+'-audio').addEventListener('play',()=>{for(const other of SIDES)stopSound(app.panels[other],other===side);controls();});['pause','ended'].forEach(event=>$(side+'-audio').addEventListener(event,controls));draw(panel);}
async function health(panel){if(panel.healthBusy)return;panel.healthBusy=true;try{const response=await fetch('/api/'+panel.id+'/health',{cache:'no-store'}),data=await response.json();if(!response.ok||!data.ready)throw new Error(data.error||'服务器尚未就绪');panel.ready=true;$(panel.id+'-health').className='health ready';$(panel.id+'-health').textContent='就绪 · '+data.active+'/'+(data.runtime.max_streams||2);$(panel.id+'-health').title='连接检测 '+seconds(data.elapsed_ms)+' 秒';}catch(error){panel.ready=false;$(panel.id+'-health').className='health failed';$(panel.id+'-health').textContent='连接失败';$(panel.id+'-health').title=error.message;}finally{panel.healthBusy=false;controls();}}
function stopSound(panel,keepAudio=false){if(!panel)return;for(const node of panel.nodes){node.onended=null;try{node.stop();node.disconnect();}catch(_){}}panel.nodes.clear();panel.nextAt=0;if(!keepAudio)$(panel.id+'-audio').pause();}
async function enableSound(panel){for(const side of SIDES)if(side!==panel.id)stopSound(app.panels[side]);if(!panel.context){const AudioClass=window.AudioContext||window.webkitAudioContext;if(!AudioClass)throw new Error('浏览器不支持流式播放，可在完成后重播');panel.context=new AudioClass({latencyHint:'interactive'});}await panel.context.resume();}
function draw(panel){const canvas=$(panel.id+'-wave'),ratio=window.devicePixelRatio||1,w=Math.max(100,canvas.clientWidth),h=54;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);const context=canvas.getContext('2d');context.scale(ratio,ratio);context.strokeStyle='#e5ecf7';context.beginPath();context.moveTo(0,h/2);context.lineTo(w,h/2);context.stroke();const bins=panel.run?.wave||[];if(!bins.length)return;const count=Math.min(100,bins.length),step=w/count;for(let i=0;i<count;i++){const from=Math.floor(i*bins.length/count),to=Math.max(from+1,Math.floor((i+1)*bins.length/count));let square=0;for(let j=from;j<to;j++)square+=bins[j]*bins[j];const height=Math.max(1,Math.min(h-5,Math.sqrt(square/(to-from))*130));context.fillStyle='#88aaf0';context.fillRect(i*step+.6,(h-height)/2,Math.max(1,step-1.2),height);}}
function segmentStats(run){return run.segments.map(segment=>({index:segment.index,cached:segment.cached,seconds:segment.samples/24000,rms_dbfs:segment.samples?db(Math.sqrt(segment.square/segment.samples)):null,peak_dbfs:segment.peak?db(segment.peak):null}));}
function showSegments(panel){const run=panel.run,stats=segmentStats(run),host=$(panel.id+'-segments');host.replaceChildren();for(const item of stats){const chip=document.createElement('span');chip.className='segment'+(item.cached?' cached':'');chip.textContent='第'+(item.index+1)+'段 · '+(item.cached?'复用':'新生成')+(item.rms_dbfs!=null?' · '+(Number.isFinite(item.rms_dbfs)?item.rms_dbfs.toFixed(1):'静音')+' dBFS':'');host.append(chip);}const note=$(panel.id+'-level');note.className='level-note';if(!run.success){note.textContent=stats.length?'分段原始音量测量中；两侧播放增益均为1倍。':'收到音频后显示各段RMS音量。';return;}const reused=run.cached.filter(Boolean).length;note.textContent=(reused?reused+'/'+run.cached.length+'段复用':'全部'+run.cached.length+'段新生成')+'；音量未额外处理。';if(stats.length>1){const tail=stats.at(-1),previous=stats.at(-2);if(Number.isFinite(tail.rms_dbfs)&&Number.isFinite(previous.rms_dbfs)&&previous.rms_dbfs-tail.rms_dbfs>=8){note.className='level-note warning';note.textContent+=' 尾段RMS比前段低'+(previous.rms_dbfs-tail.rms_dbfs).toFixed(1)+' dB。';host.lastElementChild?.classList.add('low');}}}
function pcm(panel,run,bytes){if(bytes.length%2||run.bytes+bytes.length>app.config.max_pcm_bytes)throw new Error('音频长度无效或超出测试限制');if(!run.segments.length)throw new Error('缺少分段信息');const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),samples=new Float32Array(bytes.length/2),segment=run.segments.at(-1);for(let i=0;i<samples.length;i++){const value=view.getInt16(i*2,true)/32768;samples[i]=value;segment.square+=value*value;segment.samples++;segment.peak=Math.max(segment.peak,Math.abs(value));run.binSquare+=value*value;run.binSamples++;if(run.binSamples===480){run.wave.push(Math.sqrt(run.binSquare/run.binSamples));run.binSquare=0;run.binSamples=0;}}if(run.firstMs==null){run.firstMs=performance.now()-run.startPerf;metric(panel.id,'first',run.firstMs);}run.pcm.push(bytes);run.bytes+=bytes.length;metric(panel.id,'duration',run.bytes/48);$(panel.id+'-bytes').textContent=(run.bytes/1024).toFixed(1)+' KiB 已接收';draw(panel);showSegments(panel);if(!run.auto||!panel.context||panel.context.state!=='running')return;const context=panel.context,start=Math.max(context.currentTime+.055,panel.nextAt),buffer=context.createBuffer(1,samples.length,24000);buffer.copyToChannel(samples,0);const source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);panel.nodes.add(source);panel.nextAt=start+buffer.duration;if(run.playMs==null){const stamp=context.getOutputTimestamp?.();run.playMs=Math.max(0,stamp?.performanceTime>0?stamp.performanceTime+(start-stamp.contextTime)*1000-run.startPerf:performance.now()-run.startPerf+(start-context.currentTime+(context.baseLatency||0))*1000);metric(panel.id,'play',run.playMs,true);}source.onended=()=>{panel.nodes.delete(source);source.disconnect();if(panel.run===run&&run.success&&!panel.nodes.size)phase(panel,'合成完成，播放已结束','complete');controls();};source.start(start);}
function wav(parts,length){const output=new Uint8Array(44+length),view=new DataView(output.buffer),text=(offset,value)=>{for(let i=0;i<value.length;i++)output[offset+i]=value.charCodeAt(i);};text(0,'RIFF');view.setUint32(4,36+length,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,24000,true);view.setUint32(28,48000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,length,true);let offset=44;for(const part of parts){output.set(part,offset);offset+=part.length;}return new Blob([output],{type:'audio/wav'});}
function record(panel,run){if(run.logged)return;run.logged=true;app.history.unshift({time:new Date(run.wallTime).toISOString(),side:panel.id,server_name:NAMES[panel.id],endpoint:panel.backend.endpoint,pair_id:run.pairId,voice_id:run.voice,voice_name:run.voiceName,mode:run.mode,characters:Array.from(run.text).length,result:run.success?'complete':run.cancelled?'cancelled':'failed',first_pcm_ms:run.firstMs,playback_start_estimate_ms:run.playMs,complete_ms:run.completeMs,audio_seconds:run.bytes/48000,cached:run.cached,pcm_sha256:run.result?.pcm_sha256||null,segment_levels:segmentStats(run).map(item=>({...item,rms_dbfs:Number.isFinite(item.rms_dbfs)?item.rms_dbfs:null})),error:run.error||null});app.history=app.history.slice(0,24);$('history').replaceChildren();for(const row of app.history){const tr=document.createElement('tr'),time=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Singapore',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(row.time)),cells=[time,row.server_name,row.voice_name,row.mode==='fresh'?'新合成':'同文复测',seconds(row.first_pcm_ms),seconds(row.complete_ms),row.audio_seconds?row.audio_seconds.toFixed(2):'—'];for(let i=0;i<cells.length;i++){const td=document.createElement('td');td.textContent=cells[i];if(i>=4)td.className='mono';tr.append(td);}const td=document.createElement('td'),tag=document.createElement('span');tag.className='result-tag'+(row.result==='complete'?'':' failed');tag.textContent=row.result==='complete'?(row.cached.some(Boolean)?row.cached.filter(Boolean).length+'/'+row.cached.length+'段复用':'新生成'):row.result==='cancelled'?'已停止':'失败';td.append(tag);tr.append(td);$('history').append(tr);}compareSummary();controls();}
function compareSummary(){const pair=app.batch;if(!pair)return;const runs=SIDES.map(side=>app.panels[side].run);if(!runs.every(run=>run?.pairId===pair&&run.success))return;const [foreign,domestic]=runs,note=$('comparisonNote');if(runs.some(run=>run.cached.some(Boolean))){note.textContent='本次包含音频复用，请结合各侧复用标记比较，不作为全新合成速度结论。';return;}const delta=foreign.completeMs-domestic.completeMs;note.replaceChildren(document.createTextNode('本轮相同音色和文字，两侧均未命中缓存。'));const strong=document.createElement('strong');strong.textContent=(delta>=0?'国内':'国外')+'完整返回快 '+(Math.abs(delta)/1000).toFixed(2)+' 秒。';note.append(strong,document.createTextNode(' 可分别播放，对比声线和尾段音量。'));}
function event(panel,run,message){if(panel.run!==run||run.cancelled)return;if(message.type==='start'){if(message.endpoint!==panel.backend.endpoint)throw new Error('返回的服务目标不匹配');return;}if(message.type==='connected'){phase(panel,'服务器已响应，正在等待第一段音频…');return;}if(message.type==='metadata'){if(message.voice_id!==run.voice||message.rate!==24000||message.channels!==1||message.format!=='pcm_s16le')throw new Error('音频格式不匹配');run.total=message.total;return;}if(message.type==='segment'){if(message.segment!==run.segments.length||message.total!==run.total||typeof message.cached!=='boolean')throw new Error('音频分段顺序无效');run.cached.push(message.cached);run.segments.push({index:message.segment,cached:message.cached,samples:0,square:0,peak:0});phase(panel,'接收第 '+(message.segment+1)+' / '+message.total+' 段音频');showSegments(panel);return;}if(message.type==='pcm'){const raw=atob(message.audio),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);pcm(panel,run,bytes);return;}if(message.type==='done'){run.result=message;return;}if(message.type==='cancelled')throw new DOMException('已停止','AbortError');throw new Error(message.message||'服务器返回未知音频消息');}
async function start(panel,mode,pairId=null){if(!app.config||!panel.ready||panel.run?.active)return;const selected=selectedVoice(),text=$('text').value;if(!selected||!text.trim())return;if(mode==='repeat'&&(!panel.previous||panel.previous.voice!==selected.id||panel.previous.text!==text))return;stopSound(panel);if(panel.url){URL.revokeObjectURL(panel.url);panel.url=null;}$(panel.id+'-result').hidden=true;$(panel.id+'-audio').removeAttribute('src');$(panel.id+'-audio').load();const run={id:crypto.randomUUID().replaceAll('-',''),pairId,voice:selected.id,voiceName:selected.name,text,mode,auto:$('liveSource').value===panel.id,active:true,success:false,cancelled:false,wallTime:Date.now(),startPerf:performance.now(),endPerf:null,firstMs:null,playMs:null,completeMs:null,bytes:0,pcm:[],wave:[],binSquare:0,binSamples:0,cached:[],segments:[],result:null,error:null,controller:new AbortController()};panel.run=run;for(const name of ['first','complete','play','duration'])metric(panel.id,name,null);$(panel.id+'-bytes').textContent='等待音频';draw(panel);showSegments(panel);phase(panel,'正在连接'+NAMES[panel.id]+'…');controls();if(run.auto)enableSound(panel).catch(()=>{phase(panel,'浏览器未启用流式播放，合成完成后可点播放');});try{const response=await fetch('/api/'+panel.id+'/synthesize',{method:'POST',headers:{'Content-Type':'application/json','X-Voice-Test-Token':panel.backend.token},signal:run.controller.signal,body:JSON.stringify({run_id:run.id,text,voice_id:run.voice,mode,previous_id:mode==='repeat'?panel.previous.id:null})});if(!response.ok){const error=await response.json();throw new Error(error.error||'生成请求失败');}const reader=response.body.getReader(),decoder=new TextDecoder('utf-8',{fatal:true});let pending='';while(true){const chunk=await reader.read();if(chunk.done)break;pending+=decoder.decode(chunk.value,{stream:true});if(pending.length>6000000)throw new Error('音频消息过大');let at;while((at=pending.indexOf('\n'))>=0){const line=pending.slice(0,at);pending=pending.slice(at+1);if(line)event(panel,run,JSON.parse(line));}}pending+=decoder.decode();if(pending.trim()||!run.result||run.result.pcm_bytes!==run.bytes||run.result.segments!==run.segments.length||run.result.segments!==run.total)throw new Error('音频未完整返回');if(run.cancelled||panel.run!==run)return;run.active=false;run.success=true;run.endPerf=performance.now();run.completeMs=run.endPerf-run.startPerf;metric(panel.id,'complete',run.completeMs);if(run.binSamples)run.wave.push(Math.sqrt(run.binSquare/run.binSamples));draw(panel);showSegments(panel);panel.url=URL.createObjectURL(wav(run.pcm,run.bytes));$(panel.id+'-audio').src=panel.url;$(panel.id+'-download').href=panel.url;$(panel.id+'-download').download='xiaoya-'+panel.id+'-'+run.voice+'-'+Date.now()+'.wav';$(panel.id+'-result').hidden=false;panel.previous={id:run.id,text,voice:run.voice};phase(panel,panel.nodes.size?'合成完成，正在播放剩余音频':'合成完成，可分别播放试听','complete');record(panel,run);}catch(error){if(panel.run===run&&!run.cancelled){run.active=false;run.endPerf=performance.now();run.error=error.message;stopSound(panel);phase(panel,error.message,'failed');record(panel,run);}cancelRemote(panel,run);}finally{if(panel.run===run){run.active=false;run.endPerf=run.endPerf||performance.now();controls();health(panel);}}}
function cancelRemote(panel,run){fetch('/api/'+panel.id+'/cancel',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Voice-Test-Token':panel.backend.token},body:JSON.stringify({run_id:run.id})}).catch(()=>{});}
function stop(panel){if(!panel)return;stopSound(panel);const run=panel.run;if(run?.active){run.active=false;run.cancelled=true;run.endPerf=performance.now();run.controller.abort();cancelRemote(panel,run);phase(panel,'已停止本侧请求','failed');record(panel,run);}else if(run?.success)phase(panel,'合成已完成，播放已停止','complete');controls();}
function count(){$('charCount').textContent=Array.from($('text').value).length.toLocaleString()+' 字';controls();}
function sample(full){$('text').value=selectedVoice()?.language==='en'?(full?FULL_EN:SHORT_EN):(full?app.config.greeting:SHORT_ZH);count();}
$('startBoth').addEventListener('click',()=>{app.batch=crypto.randomUUID().replaceAll('-','');$('comparisonNote').textContent='两侧正在使用同一音色和文字独立生成…';const pair=app.batch;Promise.all(SIDES.map(side=>start(app.panels[side],'fresh',pair)));});
$('stopBoth').addEventListener('click',()=>SIDES.forEach(side=>stop(app.panels[side])));
$('checkBoth').addEventListener('click',()=>Promise.all(SIDES.map(side=>health(app.panels[side]))));
$('text').addEventListener('input',count);$('text').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!$('startBoth').disabled){event.preventDefault();$('startBoth').click();}});
$('voice').addEventListener('change',()=>{const old=$('text').value;$('language').textContent=selectedVoice()?.language==='en'?'英语 · English':'中文 · Mandarin';if([app.config.greeting,SHORT_ZH,SHORT_EN,FULL_EN].includes(old))sample(old===app.config.greeting||old===FULL_EN);controls();});
$('shortSample').addEventListener('click',()=>sample(false));$('fullSample').addEventListener('click',()=>sample(true));
$('exportHistory').addEventListener('click',()=>{const data={schema:'xiaoya-voice-comparison-v1',backends:app.config.backends.map(({id,name,endpoint})=>({id,name,endpoint})),records:app.history},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='xiaoya-voice-comparison-'+Date.now()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
window.addEventListener('resize',()=>SIDES.forEach(side=>app.panels[side]&&draw(app.panels[side])));
window.addEventListener('pagehide',()=>{for(const side of SIDES){const panel=app.panels[side],run=panel?.run;if(run?.active){run.controller.abort();cancelRemote(panel,run);}}});
setInterval(()=>{for(const side of SIDES){const panel=app.panels[side],run=panel?.run;if(run)$(side+'-elapsed').textContent=(((run.active?performance.now():run.endPerf||performance.now())-run.startPerf)/1000).toFixed(1);}},100);
(async()=>{try{const response=await fetch('/api/config',{cache:'no-store'});if(!response.ok)throw new Error('无法读取本机对比配置');const config=await response.json();if(config.comparison!==true||config.backends?.length!==2||config.backends.some((item,index)=>item.id!==SIDES[index]))throw new Error('两侧服务器配置不完整');app.config=config;for(const voice of config.voices){const option=document.createElement('option');option.value=voice.id;option.textContent=voice.name;$('voice').append(option);}$('voice').value=config.default_voice_id;$('text').value=config.greeting;config.backends.forEach(createPanel);count();await Promise.all(SIDES.map(side=>health(app.panels[side])));}catch(error){$('comparisonNote').textContent=error.message;$('comparisonNote').style.color='#b96470';}controls();})();
</script>
