# 在现有HTTPS站点的server块中包含本片段；先备份并nginx -t，再平滑reload。--yyl
# 保留 /v1/stream 的原路径和query，HHT签名不支持基础URL含路径。
location = /v1/stream {
    client_max_body_size 360k;
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # 上游已有no-store，先隐藏再统一输出，避免严格HTTP解码器收到重复头。--yyl
    proxy_hide_header Cache-Control;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
}

location = /voice/health {
    proxy_pass http://127.0.0.1:8793/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}
