# voice专用站点；现有Cloudflare Origin通配证书覆盖*.6xmu.com。--yyl
# 共享片段仅开放签名语音流和兼容健康入口，其他路径返回404。--yyl
server {
    listen 80;
    listen [::]:80;
    server_name voice.6xmu.com;

    include /etc/nginx/snippets/xiaoya-voice.conf;
    # 专用域名兼容边缘 HTTP 回源，两个接口继续由容器校验签名。--yyl
    location = /v1/preview {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache off;
    }
    location = /v1/transcribe {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 22s;
        proxy_cache off;
    }
    location = / { return 302 https://voice.6xmu.com/health; }
    location = /health { rewrite ^/health$ /voice/health last; }
    location / { return 404; }
}

server {
    # 原 listen 443 ssl / listen [::]:443 ssl；共享443需与现有站点的协议选项一致。--yyl
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice.6xmu.com;

    ssl_certificate /etc/nginx/ssl/aichat.6xmu.com.pem;
    ssl_certificate_key /etc/nginx/ssl/aichat.6xmu.com.key;

    include /etc/nginx/snippets/xiaoya-voice.conf;
    location = /v1/preview {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache off;
    }
    # 专用语音域名的两个签名接口。--yyl
    location = /v1/transcribe {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 22s;
        proxy_cache off;
    }
    location = / { return 302 https://voice.6xmu.com/health; }
    location = /health { rewrite ^/health$ /voice/health last; }
    location / { return 404; }
}
