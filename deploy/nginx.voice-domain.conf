# voice专用站点；现有Cloudflare Origin通配证书覆盖*.6xmu.com。--yyl
# 共享片段仅开放签名语音流和兼容健康入口，其他路径返回404。--yyl
server {
    listen 80;
    listen [::]:80;
    server_name voice.6xmu.com;

    include /etc/nginx/snippets/xiaoya-voice.conf;
    location = / { return 302 https://voice.6xmu.com/health; }
    location = /health { rewrite ^/health$ /voice/health last; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.6xmu.com;

    ssl_certificate /etc/nginx/ssl/aichat.6xmu.com.pem;
    ssl_certificate_key /etc/nginx/ssl/aichat.6xmu.com.key;

    include /etc/nginx/snippets/xiaoya-voice.conf;
    location = / { return 302 https://voice.6xmu.com/health; }
    location = /health { rewrite ^/health$ /voice/health last; }
    location / { return 404; }
}
